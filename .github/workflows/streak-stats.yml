name: Update Contribution Streak

on:
  schedule:
    - cron: "13 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Contribution Streak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak statistics
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark-blue&hide_border=true&disable_animations=true&date_format=j%20M%5B%20Y%5D
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify streak card
        run: |
          test -s profile/streak.svg

      - name: Commit streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update contribution streak"
          git push
