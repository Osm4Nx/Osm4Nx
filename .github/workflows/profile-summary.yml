name: Update Profile Summary Cards

on:
  schedule:
    - cron: "37 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary
  cancel-in-progress: true

jobs:
  build:
    name: Generate Profile Summary Cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 3
          EXCLUDE: ""
          AUTO_PUSH: true
          THEME: github_dark
          ANIMATION: ""
          DURATION: ""
          NAME: ""

      - name: Show generated files
        run: |
          echo "======================================"
          echo "Generated files:"
          echo "======================================"

          if [ -d "profile-summary-card-output" ]; then
            find profile-summary-card-output -type f -print
          else
            echo "ERROR: profile-summary-card-output directory does not exist."
            exit 1
          fi

      - name: Verify Profile Details Card
        run: |
          echo "Searching for profile details SVG..."

          PROFILE_DETAILS=$(find profile-summary-card-output \
            -type f \
            -name "3-profile-details.svg" \
            -print \
            -quit)

          if [ -z "$PROFILE_DETAILS" ]; then
            echo "ERROR: 3-profile-details.svg was not generated."
            echo ""
            echo "Available files:"
            find profile-summary-card-output -type f -print
            exit 1
          fi

          echo "Found:"
          echo "$PROFILE_DETAILS"

          test -s "$PROFILE_DETAILS"

      - name: Copy Profile Details Card
        run: |
          mkdir -p profile

          PROFILE_DETAILS=$(find profile-summary-card-output \
            -type f \
            -name "3-profile-details.svg" \
            -print \
            -quit)

          if [ -z "$PROFILE_DETAILS" ]; then
            echo "ERROR: Profile details card not found."
            exit 1
          fi

          cp "$PROFILE_DETAILS" profile/profile-details.svg

      - name: Verify Final SVG
        run: |
          echo "Checking final SVG..."

          test -s profile/profile-details.svg

          echo ""
          echo "======================================"
          echo "Profile details generated successfully"
          echo "======================================"

          ls -lh profile/profile-details.svg

      - name: Commit Profile Details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/profile-details.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update profile summary card"
          git push
