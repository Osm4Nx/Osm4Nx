name: Update Profile Summary Cards

on:
  schedule:
    - cron: "37 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-summary.yml"

permissions:
  contents: write

concurrency:
  group: profile-summary
  cancel-in-progress: true

jobs:
  build:
    name: Generate Profile Summary Cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 3
          EXCLUDE: ""
          AUTO_PUSH: false
          THEME: github_dark
          ANIMATION: ""
          DURATION: ""
          NAME: ""

      - name: Prepare profile directory
        run: |
          mkdir -p profile

      - name: Copy profile details card
        run: |
          test -s profile-summary-card-output/github_dark/3-profile-details.svg

          cp \
            profile-summary-card-output/github_dark/3-profile-details.svg \
            profile/profile-details.svg

      - name: Verify generated SVG
        run: |
          test -s profile/profile-details.svg

          echo "Profile summary card generated successfully."
          ls -lh profile/profile-details.svg

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/profile-details.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update profile summary card"
          git push
